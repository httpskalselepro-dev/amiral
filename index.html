<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMIRAL — Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Unifrakturmaguntia&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a;
    --paper:#faf9f6;
    --pink:#ff5fa2;
    --red:#e8321b;
    --grey:#8a8680;
    --line:#e6e3dc;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;}
  ::selection{background:var(--pink);color:#fff;}

  /* ---------- topbar ---------- */
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;background:rgba(250,249,246,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .brandmark{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .brandmark .dot{width:8px;height:8px;background:var(--red);border-radius:50%;display:inline-block;}
  .topright{display:flex;align-items:center;gap:10px;}
  .iconbtn{position:relative;background:none;border:1px solid var(--ink);border-radius:999px;width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
  .iconbtn:hover{background:var(--ink);color:#fff;}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;
    width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .editbtn{font-size:12px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--ink);
    background:none;padding:8px 14px;border-radius:999px;cursor:pointer;font-family:inherit;font-weight:600;}
  .editbtn.on{background:var(--ink);color:var(--paper);}
  .publishbtn{font-size:12px;text-transform:uppercase;letter-spacing:.06em;background:var(--red);color:#fff;
    border:none;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-family:inherit;}
  .publishbtn:disabled{opacity:.35;cursor:default;}

  /* ---------- hero ---------- */
  .hero{position:relative;padding:90px 28px 70px;text-align:center;overflow:hidden;background:var(--ink);color:var(--paper);}
  .hero::before{content:'';position:absolute;inset:0;background:
    radial-gradient(circle at 15% 20%, rgba(255,95,162,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(232,50,27,.15), transparent 40%);}
  .hero-inner{position:relative;z-index:2;max-width:720px;margin:0 auto;}
  .eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--pink);margin-bottom:18px;}
  .hero h1{font-family:'Anton',sans-serif;font-size:clamp(52px,11vw,110px);line-height:.9;margin:0;letter-spacing:.5px;}
  .scribble{display:block;width:min(420px,70%);height:26px;margin:6px auto 0;}
  .scribble path{stroke:var(--red);stroke-width:6;fill:none;stroke-linecap:round;}
  .tagline{font-family:'Unifrakturmaguntia',cursive;font-size:clamp(18px,3vw,26px);color:var(--pink);margin:18px 0 34px;
    opacity:.95;}
  .hero-cta{display:inline-flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .btn-primary{background:var(--pink);color:#0a0a0a;border:none;padding:14px 28px;border-radius:999px;font-weight:700;
    text-transform:uppercase;font-size:13px;letter-spacing:.06em;cursor:pointer;font-family:inherit;transition:.15s;}
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-ghost{background:none;border:1px solid rgba(250,249,246,.4);color:var(--paper);padding:14px 28px;border-radius:999px;
    font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em;cursor:pointer;font-family:inherit;}
  .hero-edit{margin-top:24px;display:flex;flex-direction:column;gap:8px;max-width:460px;margin-left:auto;margin-right:auto;}
  .hero-edit input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 12px;
    border-radius:8px;font-family:inherit;font-size:13px;text-align:center;}

  /* ---------- filters ---------- */
  .filters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:20px 20px 4px;}
  .chip{border:1px solid var(--line);background:none;padding:5px 13px;border-radius:999px;font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;cursor:pointer;font-family:inherit;font-weight:600;color:var(--grey);
    transition:.15s;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .chip:hover{border-color:var(--ink);color:var(--ink);}

  /* ---------- grid ---------- */
  .grid{max-width:1180px;margin:0 auto;padding:30px 24px 90px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;
    transition:.2s;display:flex;flex-direction:column;}
  .card:hover{box-shadow:0 14px 30px rgba(0,0,0,.08);transform:translateY(-3px);}
  .card-img{aspect-ratio:3/4;background:#eee;overflow:hidden;cursor:pointer;position:relative;}
  .card-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-badge{position:absolute;top:10px;left:10px;background:var(--pink);color:#0a0a0a;font-size:10px;font-weight:700;
    padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;}
  .card-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-name{font-weight:700;font-size:15px;line-height:1.25;cursor:pointer;}
  .card-desc{font-size:12.5px;color:var(--grey);line-height:1.4;flex:1;}
  .card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .price{font-weight:700;font-size:14.5px;}
  .price.soon{color:var(--grey);font-weight:500;font-size:12.5px;font-style:italic;}
  .addbtn{border:1px solid var(--ink);background:none;padding:7px 14px;border-radius:999px;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.05em;cursor:pointer;font-weight:700;font-family:inherit;}
  .addbtn:hover{background:var(--ink);color:#fff;}

  /* edit-mode card controls */
  .editfields{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .editfields input,.editfields textarea,.editfields select{font-family:inherit;font-size:12.5px;padding:6px 8px;
    border:1px solid var(--line);border-radius:7px;width:100%;background:#fbfaf8;}
  .editfields textarea{resize:vertical;min-height:44px;}
  .editrow-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--grey);margin-top:2px;}
  .delbtn{position:absolute;top:10px;right:10px;background:rgba(10,10,10,.75);color:#fff;border:none;
    width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;z-index:3;}
  .imgupload{font-size:11px;}
  .sizetoggle{display:flex;gap:6px;flex-wrap:wrap;}
  .sizetoggle button{border:1px solid var(--ink);background:none;padding:4px 9px;border-radius:6px;font-size:11px;
    cursor:pointer;font-family:inherit;}
  .sizetoggle button.on{background:var(--ink);color:#fff;}

  .addcard{border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;
    min-height:280px;cursor:pointer;color:var(--grey);font-weight:700;font-size:13px;text-transform:uppercase;
    letter-spacing:.05em;flex-direction:column;gap:8px;background:transparent;}
  .addcard:hover{border-color:var(--pink);color:var(--pink);}
  .addcard span{font-size:34px;line-height:1;}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);padding:34px 28px;text-align:center;font-size:12px;color:var(--grey);}
  footer b{color:var(--ink);font-family:'Anton',sans-serif;letter-spacing:.5px;}

  /* ---------- modal (product) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:100;display:none;align-items:center;
    justify-content:center;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:16px;max-width:820px;width:100%;max-height:88vh;overflow:auto;
    display:grid;grid-template-columns:1fr 1fr;position:relative;}
  @media(max-width:640px){.modal{grid-template-columns:1fr;}}
  .modal-close{position:absolute;top:14px;right:14px;background:var(--ink);color:#fff;border:none;width:32px;height:32px;
    border-radius:50%;cursor:pointer;font-size:16px;z-index:5;}
  .modal-img{background:#eee;}
  .modal-img img{width:100%;height:100%;object-fit:cover;display:block;min-height:280px;}
  .modal-info{padding:32px 30px;display:flex;flex-direction:column;gap:14px;}
  .modal-info h2{font-family:'Anton',sans-serif;font-size:28px;margin:0;letter-spacing:.3px;}
  .modal-desc{color:var(--grey);font-size:14px;line-height:1.5;}
  .modal-price{font-size:20px;font-weight:700;}
  .size-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);margin-top:6px;}
  .sizepick{display:flex;gap:8px;flex-wrap:wrap;}
  .sizepick button{border:1px solid var(--ink);background:none;padding:8px 16px;border-radius:8px;font-size:13px;
    cursor:pointer;font-family:inherit;font-weight:600;}
  .sizepick button.sel{background:var(--ink);color:#fff;}
  .modal-add{margin-top:auto;background:var(--pink);color:#0a0a0a;border:none;padding:14px;border-radius:999px;
    font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em;cursor:pointer;font-family:inherit;}
  .modal-add:disabled{opacity:.4;cursor:default;}

  /* ---------- cart drawer ---------- */
  .drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100%;background:var(--paper);
    z-index:110;box-shadow:-10px 0 40px rgba(0,0,0,.2);transition:right .28s ease;display:flex;flex-direction:column;}
  .drawer.show{right:0;}
  .drawer-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h3{margin:0;font-family:'Anton',sans-serif;font-size:20px;letter-spacing:.3px;}
  .drawer-close{background:none;border:none;font-size:20px;cursor:pointer;}
  .drawer-items{flex:1;overflow:auto;padding:14px 22px;display:flex;flex-direction:column;gap:14px;}
  .citem{display:flex;gap:12px;align-items:center;}
  .citem img{width:58px;height:70px;object-fit:cover;border-radius:8px;background:#eee;}
  .citem-info{flex:1;}
  .citem-name{font-size:13px;font-weight:700;}
  .citem-meta{font-size:11.5px;color:var(--grey);}
  .citem-rm{background:none;border:none;color:var(--grey);cursor:pointer;font-size:12px;text-decoration:underline;}
  .drawer-empty{color:var(--grey);font-size:13px;text-align:center;margin-top:40px;}
  .drawer-foot{border-top:1px solid var(--line);padding:18px 22px;display:flex;flex-direction:column;gap:10px;}
  .drawer-total{display:flex;justify-content:space-between;font-weight:700;font-size:15px;}
  .checkoutbtn{background:#25D366;color:#0a0a0a;border:none;padding:14px;border-radius:999px;font-weight:700;
    text-transform:uppercase;font-size:13px;letter-spacing:.05em;cursor:pointer;font-family:inherit;}
  .checkout-input{font-family:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;width:100%;background:#fff;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);
    color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .savebar{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:12px 22px;
    display:none;align-items:center;justify-content:center;gap:16px;z-index:60;font-size:13px;}
  .savebar.show{display:flex;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brandmark" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span class="dot"></span>AMIRAL</div>
  <div class="topright">
    <button class="editbtn" id="editToggle">✎ Mode édition</button>
    <button class="publishbtn" id="publishBtn" disabled>Publier</button>
    <button class="iconbtn" id="cartBtn">🛍<span class="badge" id="cartCount" style="display:none">0</span></button>
  </div>
</div>

<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Amiral.sn — Édition limitée</div>
    <h1 id="heroTitle">AMIRAL</h1>
    <svg class="scribble" viewBox="0 0 400 26"><path d="M6 14 C 80 2, 140 24, 210 10 S 340 2, 394 14"/></svg>
    <div class="tagline" id="heroTag">Pretty girl wears amiral</div>
    <div class="hero-cta">
      <button class="btn-primary" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Voir la collection</button>
      <button class="btn-ghost" onclick="document.getElementById('cartBtn').click()">Mon panier</button>
    </div>
    <div class="hero-edit" id="heroEdit" style="display:none">
      <input id="heroTitleInput" placeholder="Titre">
      <input id="heroTagInput" placeholder="Tagline">
    </div>
  </div>
</section>

<div class="filters" id="filters">
  <button class="chip active" data-cat="all">Tout</button>
  <button class="chip" data-cat="tshirts">T-shirts</button>
  <button class="chip" data-cat="debardeurs">Débardeurs</button>
  <button class="chip" data-cat="accessoires">Accessoires</button>
</div>

<div class="grid" id="grid"></div>

<footer><b>AMIRAL</b><br>Boutique en ligne — Amiral.sn</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Panier</h3>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div class="drawer-total"><span>Total</span><span id="drawerTotal">0 FCFA</span></div>
    <input id="custName" class="checkout-input" placeholder="Ton nom">
    <input id="custPhone" class="checkout-input" placeholder="Ton numéro (optionnel)">
    <button class="checkoutbtn" id="checkoutBtn">Commander sur WhatsApp</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="savebar" id="saveBar">Mode édition activé — modifie ta boutique, puis clique sur "Publier" pour enregistrer.</div>

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let editMode = false;
let activeCat = "all";
let cart = [];
let currentModalProduct = null;
let modalSize = null;
let dirty = false;

const STORAGE_KEY = "amiral-store-state";

/* ---------------- storage ---------------- */
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && parsed.products) state = parsed;
    }
  }catch(e){ /* no saved state yet, use defaults */ }
  render();
}

async function saveState(){
  try{
    const res = await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
    if(res){
      showToast("Boutique publiée ✓");
      dirty = false;
      document.getElementById('publishBtn').disabled = true;
    }else{
      showToast("Erreur lors de la publication");
    }
  }catch(e){
    showToast("Erreur lors de la publication");
  }
}

function markDirty(){
  dirty = true;
  document.getElementById('publishBtn').disabled = false;
}

/* ---------------- helpers ---------------- */
function fmtPrice(p){
  return p ? (Number(p).toLocaleString('fr-FR') + " FCFA") : null;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function genId(){
  return Date.now() + Math.floor(Math.random()*1000);
}

/* ---------------- render ---------------- */
function render(){
  document.getElementById('heroTitle').textContent = state.hero.title;
  document.getElementById('heroTag').textContent = state.hero.tag;
  document.getElementById('heroTitleInput').value = state.hero.title;
  document.getElementById('heroTagInput').value = state.hero.tag;

  const grid = document.getElementById('grid');
  grid.innerHTML = "";

  const items = state.products.filter(p => activeCat === "all" || p.category === activeCat);

  items.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    const priceHtml = editMode ? "" : (p.price
      ? `<span class="price">${fmtPrice(p.price)}</span>`
      : `<span class="price soon">Bientôt disponible</span>`);

    card.innerHTML = `
      ${editMode ? `<button class="delbtn" data-del="${p.id}">✕</button>` : ""}
      <div class="card-img" data-open="${p.id}">
        <img src="${p.image}" alt="${p.name}">
        ${p.badge ? `<span class="card-badge">${p.badge}</span>` : ""}
      </div>
      <div class="card-body">
        ${editMode ? `
          <div class="editfields">
            <div class="editrow-label">Nom</div>
            <input data-field="name" data-id="${p.id}" value="${p.name.replace(/"/g,'&quot;')}">
            <div class="editrow-label">Badge</div>
            <input data-field="badge" data-id="${p.id}" value="${(p.badge||'').replace(/"/g,'&quot;')}">
            <div class="editrow-label">Catégorie</div>
            <select data-field="category" data-id="${p.id}">
              <option value="tshirts" ${p.category==='tshirts'?'selected':''}>T-shirts</option>
              <option value="debardeurs" ${p.category==='debardeurs'?'selected':''}>Débardeurs</option>
              <option value="accessoires" ${p.category==='accessoires'?'selected':''}>Accessoires</option>
            </select>
            <div class="editrow-label">Description</div>
            <textarea data-field="description" data-id="${p.id}">${p.description}</textarea>
            <div class="editrow-label">Prix (FCFA)</div>
            <input data-field="price" data-id="${p.id}" type="number" placeholder="Ex: 12000" value="${p.price ?? ''}">
            <div class="editrow-label">Tailles disponibles</div>
            <div class="sizetoggle" data-sizes="${p.id}">
              ${["M","XL","Taille unique"].map(s=>`<button data-size="${s}" data-id="${p.id}" class="${p.sizes.includes(s)?'on':''}">${s}</button>`).join('')}
            </div>
            <div class="editrow-label">Changer l'image</div>
            <input class="imgupload" type="file" accept="image/*" data-imgid="${p.id}">
          </div>
        ` : `
          <div class="card-name" data-open="${p.id}">${p.name}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-bottom">
            ${priceHtml}
            <button class="addbtn" data-quickadd="${p.id}">Ajouter</button>
          </div>
        `}
      </div>
    `;
    grid.appendChild(card);
  });

  if(editMode){
    const addCard = document.createElement('div');
    addCard.className = 'addcard';
    addCard.id = 'addProductCard';
    addCard.innerHTML = `<span>+</span>Ajouter un produit`;
    grid.appendChild(addCard);
  }

  wireGridEvents();
  renderCart();
}

function wireGridEvents(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = () => openModal(Number(el.dataset.open));
  });
  document.querySelectorAll('[data-quickadd]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      openModal(Number(el.dataset.quickadd));
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      if(confirm("Supprimer ce produit ?")){
        state.products = state.products.filter(p=>p.id !== Number(el.dataset.del));
        markDirty();
        render();
      }
    };
  });
  document.querySelectorAll('[data-field]').forEach(el=>{
    el.onchange = () => {
      const id = Number(el.dataset.id);
      const prod = state.products.find(p=>p.id===id);
      if(!prod) return;
      const field = el.dataset.field;
      prod[field] = field === 'price' ? (el.value ? Number(el.value) : null) : el.value;
      markDirty();
      if(field === 'category') render();
    };
  });
  document.querySelectorAll('.sizetoggle button').forEach(btn=>{
    btn.onclick = () => {
      const id = Number(btn.dataset.id);
      const size = btn.dataset.size;
      const prod = state.products.find(p=>p.id===id);
      if(!prod) return;
      if(prod.sizes.includes(size)){
        prod.sizes = prod.sizes.filter(s=>s!==size);
      }else{
        prod.sizes.push(size);
      }
      markDirty();
      render();
    };
  });
  document.querySelectorAll('.imgupload').forEach(inp=>{
    inp.onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const id = Number(inp.dataset.imgid);
        const prod = state.products.find(p=>p.id===id);
        if(prod){ prod.image = ev.target.result; markDirty(); render(); }
      };
      reader.readAsDataURL(file);
    };
  });
  const addProductCard = document.getElementById('addProductCard');
  if(addProductCard){
    addProductCard.onclick = () => {
      state.products.push({
        id: genId(), name:"Nouveau produit", category:"tshirts", price:null,
        description:"Description du produit...", image: IMG.p1, sizes:["M","XL"], badge:""
      });
      markDirty();
      render();
    };
  }
}

/* ---------------- modal ---------------- */
function openModal(id){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  currentModalProduct = p;
  modalSize = p.sizes[0] || null;
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <button class="modal-close" id="modalCloseBtn">✕</button>
    <div class="modal-img"><img src="${p.image}" alt="${p.name}"></div>
    <div class="modal-info">
      <h2>${p.name}</h2>
      <div class="modal-desc">${p.description}</div>
      <div class="modal-price">${p.price ? fmtPrice(p.price) : "Prix bientôt disponible"}</div>
      <div class="size-label">Taille</div>
      <div class="sizepick" id="sizepick">
        ${p.sizes.map(s=>`<button data-s="${s}" class="${s===modalSize?'sel':''}">${s}</button>`).join('')}
      </div>
      <button class="modal-add" id="modalAddBtn">Ajouter au panier</button>
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('modalCloseBtn').onclick = closeModal;
  document.querySelectorAll('#sizepick button').forEach(b=>{
    b.onclick = () => {
      modalSize = b.dataset.s;
      document.querySelectorAll('#sizepick button').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    };
  });
  document.getElementById('modalAddBtn').onclick = () => {
    addToCart(p, modalSize);
    closeModal();
  };
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  currentModalProduct = null;
}
document.getElementById('overlay').onclick = (e) => {
  if(e.target.id === 'overlay') closeModal();
};

/* ---------------- cart ---------------- */
function addToCart(p, size){
  const existing = cart.find(c => c.id===p.id && c.size===size);
  if(existing){ existing.qty += 1; }
  else{ cart.push({ id:p.id, name:p.name, image:p.image, price:p.price, size, qty:1 }); }
  renderCart();
  showToast(`${p.name} ajouté au panier`);
  document.getElementById('drawer').classList.add('show');
}
function renderCart(){
  const wrap = document.getElementById('drawerItems');
  const count = cart.reduce((a,c)=>a+c.qty,0);
  const countEl = document.getElementById('cartCount');
  countEl.textContent = count;
  countEl.style.display = count ? 'flex' : 'none';

  if(cart.length===0){
    wrap.innerHTML = `<div class="drawer-empty">Ton panier est vide.</div>`;
  }else{
    wrap.innerHTML = cart.map((c,i)=>`
      <div class="citem">
        <img src="${c.image}">
        <div class="citem-info">
          <div class="citem-name">${c.name}</div>
          <div class="citem-meta">Taille ${c.size} · Qté ${c.qty} ${c.price ? '· '+fmtPrice(c.price) : ''}</div>
          <button class="citem-rm" data-rm="${i}">Retirer</button>
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-rm]').forEach(btn=>{
      btn.onclick = () => { cart.splice(Number(btn.dataset.rm),1); renderCart(); };
    });
  }
  const total = cart.reduce((a,c)=> a + (c.price ? c.price*c.qty : 0), 0);
  document.getElementById('drawerTotal').textContent = fmtPrice(total) || "—";
}
document.getElementById('cartBtn').onclick = () => document.getElementById('drawer').classList.add('show');
document.getElementById('drawerClose').onclick = () => document.getElementById('drawer').classList.remove('show');
const WHATSAPP_NUMBER = "221752569910"; // Sénégal +221

document.getElementById('checkoutBtn').onclick = () => {
  if(cart.length===0){ showToast("Ton panier est vide"); return; }
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();

  let msg = "Bonjour AMIRAL 👋, je souhaite commander :\n\n";
  cart.forEach(c => {
    msg += `• ${c.name} — Taille ${c.size} — Qté ${c.qty}`;
    if(c.price) msg += ` — ${fmtPrice(c.price)}`;
    msg += "\n";
  });
  const total = cart.reduce((a,c)=> a + (c.price ? c.price*c.qty : 0), 0);
  if(total > 0) msg += `\nTotal : ${fmtPrice(total)}`;
  if(name) msg += `\n\nNom : ${name}`;
  if(phone) msg += `\nTéléphone : ${phone}`;

  const url = `https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  showToast("Redirection vers WhatsApp...");
};

/* ---------------- filters ---------------- */
function setActiveCat(cat){
  activeCat = cat;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.cat===cat));
  render();
}
document.querySelectorAll('.chip').forEach(el=>{
  el.onclick = () => setActiveCat(el.dataset.cat);
});

/* ---------------- edit mode ---------------- */
document.getElementById('editToggle').onclick = () => {
  editMode = !editMode;
  document.getElementById('editToggle').classList.toggle('on', editMode);
  document.getElementById('editToggle').textContent = editMode ? "✕ Quitter l'édition" : "✎ Mode édition";
  document.getElementById('heroEdit').style.display = editMode ? 'flex' : 'none';
  document.getElementById('saveBar').classList.toggle('show', editMode && dirty);
  render();
};
document.getElementById('heroTitleInput').oninput = (e) => { state.hero.title = e.target.value; document.getElementById('heroTitle').textContent = e.target.value; markDirty(); };
document.getElementById('heroTagInput').oninput = (e) => { state.hero.tag = e.target.value; document.getElementById('heroTag').textContent = e.target.value; markDirty(); };

document.getElementById('publishBtn').onclick = saveState;

const origMarkDirty = markDirty;
markDirty = function(){
  origMarkDirty();
  if(editMode) document.getElementById('saveBar').classList.add('show');
};

/* ---------------- init ---------------- */
loadState();
</script>
</body>
</html>
